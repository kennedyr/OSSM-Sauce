; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]

[env:native]
platform = native
test_framework = googletest
check_tool = clangtidy
check_flags =
  clangtidy: --checks=-*,clang-analyzer-core.NullDereference,clang-analyzer-unix.*,bugprone-*,-bugprone-macro-parentheses,readability-*,performance-*,-readability-magic-numbers,-readability-avoid-const-params-in-decls --fix

[env:esp32dev]
board = esp32dev
platform = espressif32
framework = arduino, espidf
monitor_speed = 115200
lib_deps = 
    gin66/FastAccelStepper@^0.33.9
    bblanchon/ArduinoJson@^7.4.2
    fastled/FastLED@^3.10.3