; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
lib_deps = 
    gin66/FastAccelStepper@^0.33.9
    bblanchon/ArduinoJson@^7.4.2
    fastled/FastLED@^3.10.3
; build_unflags = -std=gnu++11
; build_flags = -std=gnu++2a

; [env:test]
; platform = native
; test_framework = googletest
; lib_ignore = FastAccelStepper, FastLED
; check_tool = clangtidy
; check_flags =
;   clangtidy: --checks=-*,clang-analyzer-core.NullDereference,clang-analyzer-unix.*,bugprone-*,-bugprone-macro-parentheses,readability-*,performance-*,-readability-magic-numbers,-readability-avoid-const-params-in-decls --fix
; targets = test

[env:esp32dev]
board = esp32dev
platform = espressif32
framework = arduino, espidf
monitor_speed = 115200
; board_build.partitions = min_spiffs.csv
; board_upload.flash_size = 16MB
; board_upload.maximum_size = 16777216